services:
  yolo:
    build:
      context: ./services/yolo
    container_name: polyai-yolo
    labels:
      container_name: yolo
    logging:
      driver: json-file
      options:
        labels: container_name
    ports:
      - "8080:8080"
    environment:
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - polyai-net

  agent:
    build:
      context: ./services/agent
    container_name: polyai-agent
    labels:
      container_name: agent
    logging:
      driver: json-file
      options:
        labels: container_name
    ports:
      - "8000:8000"
    environment:
      - YOLO_SERVICE_URL=http://yolo:8080
      - IMG_PROC_MCP_URL=http://img-proc-mcp:8100/mcp
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - yolo
      - img-proc-mcp
    networks:
      - polyai-net

  frontend:
    build:
      context: ./services/frontend
    container_name: polyai-frontend
    labels:
      container_name: frontend
    logging:
      driver: json-file
      options:
        labels: container_name
    ports:
      - "3000:3000"
    depends_on:
      - agent
    networks:
      - polyai-net

  img-proc-mcp:
    build:
      context: ./services/img-proc-mcp
    container_name: polyai-img-proc-mcp
    labels:
      container_name: img-proc-mcp
    logging:
      driver: json-file
      options:
        labels: container_name
    ports:
      - "8100:8100"
    environment:
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - polyai-net

  prometheus:
    image: prom/prometheus
    container_name: polyai-prometheus
    labels:
      container_name: prometheus
    logging:
      driver: json-file
      options:
        labels: container_name
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - yolo
      - node-exporter
    networks:
      - monitoring-net
      - polyai-net

  grafana:
    image: grafana/grafana
    container_name: polyai-grafana
    labels:
      container_name: grafana
    logging:
      driver: json-file
      options:
        labels: container_name
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter
    container_name: polyai-node-exporter
    labels:
      container_name: node-exporter
    logging:
      driver: json-file
      options:
        labels: container_name
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  fluent-bit:
    image: fluent/fluent-bit:4.2.7
    container_name: polyai-fluent-bit
    labels:
      container_name: fluent-bit
    logging:
      driver: json-file
      options:
        labels: container_name
    restart: unless-stopped
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_LOGS_BUCKET=${S3_LOGS_BUCKET}

volumes:
  grafana-data:
  prometheus-data:

networks:
  polyai-net:
  monitoring-net:
