apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "__ADMIN_SSH_CIDR__"
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.gnaiem.fursa.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
