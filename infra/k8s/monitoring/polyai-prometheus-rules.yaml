apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: polyai-services
  namespace: monitoring
spec:
  groups:
    - name: polyai.availability
      rules:
        - alert: AgentDevTargetDown
          expr: absent(up{job="agent", namespace="dev"} == 1)
          for: 2m
          labels:
            severity: critical
            service: agent
            environment: dev
          annotations:
            summary: Agent metrics target is unavailable in dev
            description: Prometheus has not found a healthy dev Agent metrics target for at least two minutes.

    - name: polyai.application
      rules:
        - alert: AgentHighErrorRate
          expr: |
            (
              sum by (namespace) (rate(agent_chat_requests_total{status="error"}[5m]))
              /
              clamp_min(sum by (namespace) (rate(agent_chat_requests_total[5m])), 0.001)
            ) > 0.10
            and on (namespace)
            sum by (namespace) (increase(agent_chat_requests_total[5m])) >= 5
          for: 5m
          labels:
            severity: critical
            service: agent
          annotations:
            summary: Agent chat error rate is above 10 percent
            description: More than 10 percent of Agent chat requests have failed for five minutes in namespace {{ $labels.namespace }}.

        - alert: YoloHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, namespace) (
                rate(http_request_duration_highr_seconds_bucket{job="yolo"}[5m])
              )
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: yolo
          annotations:
            summary: YOLO p95 request latency is above two seconds
            description: YOLO p95 latency has exceeded two seconds for five minutes in namespace {{ $labels.namespace }}.
