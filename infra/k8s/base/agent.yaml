apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: gnaiem686/polyai-agent:k8s-cors
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: YOLO_SERVICE_URL
              value: "http://yolo-svc:8080"
            - name: IMG_PROC_MCP_URL
              value: "http://img-proc-mcp-svc:8100/mcp"
            - name: MODEL
              value: "bedrock/amazon.nova-micro-v1:0"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_S3_BUCKET
              value: "gnaiem-polyai-images"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: agent-svc
spec:
  type: ClusterIP
  selector:
    app: agent
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
