apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gnaiem686/PolyAI.git
    targetRevision: main
    path: infra/k8s/prod
    directory:
      include: "{frontend.yaml,frontend-service.yaml,frontend-hpa.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
