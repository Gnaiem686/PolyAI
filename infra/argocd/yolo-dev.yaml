apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yolo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gnaiem686/PolyAI.git
    targetRevision: dev
    path: infra/k8s/dev
    directory:
      include: "{yolo.yaml,yolo-service.yaml,yolo-hpa.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
