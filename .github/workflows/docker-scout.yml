name: Docker Scout

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  docker-scout:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - context: services/yolo
            image: yolo-service
          - context: services/agent
            image: agent-service
          - context: services/frontend
            image: frontend-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:scout-test

      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1.18.2
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:scout-test
          only-severities: critical,high
          exit-code: false
