name: Deploy Yolo

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            mkdir -p /home/ubuntu/pip-tmp
            export TMPDIR=/home/ubuntu/pip-tmp

            # YOLO
            cd /home/ubuntu/PolyAI/services/yolo
            source .venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart yolo.service

            # Agent
            cd /home/ubuntu/PolyAI/services/agent
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart agent.service

            # Frontend
            cd /home/ubuntu/PolyAI/services/frontend
            npm install
            npm run build
            sudo systemctl restart frontend.service

            sudo systemctl status yolo.service --no-pager
            sudo systemctl status agent.service --no-pager
            sudo systemctl status frontend.service --no-pager

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout main
            git reset --hard origin/main

            mkdir -p /home/ubuntu/pip-tmp
            export TMPDIR=/home/ubuntu/pip-tmp

            # YOLO
            cd /home/ubuntu/PolyAI/services/yolo
            source .venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart yolo.service

            # Agent
            cd /home/ubuntu/PolyAI/services/agent
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart agent.service

            # Frontend
            cd /home/ubuntu/PolyAI/services/frontend
            npm install
            npm run build
            sudo systemctl restart frontend.service

            sudo systemctl status yolo.service --no-pager
            sudo systemctl status agent.service --no-pager
            sudo systemctl status frontend.service --no-pager
