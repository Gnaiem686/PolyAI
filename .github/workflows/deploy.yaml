name: Deploy Yolo

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            cd services/yolo

            mkdir -p /home/ubuntu/pip-tmp
            export TMPDIR=/home/ubuntu/pip-tmp

            source .venv/bin/activate
            pip install --no-cache-dir -r requirements.txt

            sudo systemctl restart yolo.service
            sudo systemctl status yolo.service --no-pager

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout main
            git reset --hard origin/main

            cd services/yolo

            mkdir -p /home/ubuntu/pip-tmp
            export TMPDIR=/home/ubuntu/pip-tmp

            source .venv/bin/activate
            pip install --no-cache-dir -r requirements.txt

            sudo systemctl restart yolo.service
            sudo systemctl status yolo.service --no-pager
