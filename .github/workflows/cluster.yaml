name: Provision and Bootstrap Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region to provision
        required: true
        default: us-east-1
        type: string
      admin_ssh_cidr:
        description: Administrator public IPv4 CIDR allowed to SSH (for example, 203.0.113.10/32)
        required: true
        type: string
      alert_email:
        description: Email address that receives Alertmanager notifications (confirm the AWS SNS email after provisioning)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: polyai-cluster-${{ inputs.region }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_ssh_allowed_cidr: ${{ inputs.admin_ssh_cidr }}
  TF_VAR_alert_email: ${{ inputs.alert_email }}

jobs:
  provision:
    name: Provision
    runs-on: ubuntu-latest

    outputs:
      control_plane_ip: ${{ steps.terraform_outputs.outputs.control_plane_ip }}
      control_plane_security_group_id: ${{ steps.terraform_outputs.outputs.control_plane_security_group_id }}
      alertmanager_sns_topic_arn: ${{ steps.terraform_outputs.outputs.alertmanager_sns_topic_arn }}
      ingress_http_node_port: ${{ steps.terraform_outputs.outputs.ingress_http_node_port }}
      ingress_https_node_port: ${{ steps.terraform_outputs.outputs.ingress_https_node_port }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Check regional configuration
        run: |
          set -euo pipefail

          TFVARS_FILE="infra/tf/tfvars/${{ inputs.region }}.tfvars"

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "Missing Terraform variables file: $TFVARS_FILE"
            exit 1
          fi

      - name: Create Terraform state bucket
        id: backend
        run: |
          set -euo pipefail

          REGION="${{ inputs.region }}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="polyai-tfstate-${ACCOUNT_ID}-${REGION}"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$REGION"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$REGION" \
                --create-bucket-configuration "LocationConstraint=$REGION"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Initialize Terraform
        working-directory: infra/tf
        run: |
          set -euo pipefail

          terraform init \
            -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=polyai-cluster.tfstate" \
            -backend-config="region=${{ inputs.region }}" \
            -backend-config="encrypt=true"

          terraform workspace select "${{ inputs.region }}" \
            || terraform workspace new "${{ inputs.region }}"

      - name: Apply Terraform
        working-directory: infra/tf
        run: |
          terraform apply \
            -auto-approve \
            -var-file="tfvars/${{ inputs.region }}.tfvars"

      - name: Wait for worker ASG rollout
        working-directory: infra/tf
        run: |
          set -euo pipefail

          ASG_NAME="$(terraform output -raw worker_autoscaling_group_name)"

          for attempt in $(seq 1 120); do
            TARGET_VERSION="$(
              aws autoscaling describe-auto-scaling-groups \
                --region "${{ inputs.region }}" \
                --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].LaunchTemplate.Version' \
                --output text
            )"

            INSTANCE_ROWS="$(
              aws autoscaling describe-auto-scaling-groups \
                --region "${{ inputs.region }}" \
                --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].Instances[].[LifecycleState,HealthStatus,LaunchTemplate.Version]' \
                --output text
            )"

            if [ -n "$INSTANCE_ROWS" ] \
              && awk -v target="$TARGET_VERSION" '
                NF != 3 || $1 != "InService" || $2 != "Healthy" || $3 != target {
                  invalid = 1
                }
                END { exit invalid }
              ' <<< "$INSTANCE_ROWS"; then
              echo "All worker instances use launch-template version $TARGET_VERSION."
              break
            fi

            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for the worker ASG rollout."
              exit 1
            fi

            echo "Waiting for worker ASG rollout to version $TARGET_VERSION..."
            sleep 10
          done

      - name: Export Terraform outputs
        id: terraform_outputs
        working-directory: infra/tf
        run: |
          echo "control_plane_ip=$(terraform output -raw control_plane_public_ip)" >> "$GITHUB_OUTPUT"
          echo "control_plane_security_group_id=$(terraform output -raw control_plane_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "alertmanager_sns_topic_arn=$(terraform output -raw alertmanager_sns_topic_arn)" >> "$GITHUB_OUTPUT"
          echo "ingress_http_node_port=$(terraform output -raw ingress_http_node_port)" >> "$GITHUB_OUTPUT"
          echo "ingress_https_node_port=$(terraform output -raw ingress_https_node_port)" >> "$GITHUB_OUTPUT"

  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Bootstrap cluster over SSH
        env:
          CONTROL_PLANE_IP: ${{ needs.provision.outputs.control_plane_ip }}
          CONTROL_PLANE_SG: ${{ needs.provision.outputs.control_plane_security_group_id }}
          SNS_TOPIC_ARN: ${{ needs.provision.outputs.alertmanager_sns_topic_arn }}
          INGRESS_HTTP_NODE_PORT: ${{ needs.provision.outputs.ingress_http_node_port }}
          INGRESS_HTTPS_NODE_PORT: ${{ needs.provision.outputs.ingress_https_node_port }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          RUNNER_CIDR="$(curl -fsSL https://checkip.amazonaws.com)/32"
          KEY_FILE="${RUNNER_TEMP}/polyai-cluster.pem"
          ADDED_SSH_RULE="false"

          cleanup() {
            if [ "$ADDED_SSH_RULE" = "true" ]; then
              aws ec2 revoke-security-group-ingress \
                --region "${{ inputs.region }}" \
                --group-id "$CONTROL_PLANE_SG" \
                --protocol tcp \
                --port 22 \
                --cidr "$RUNNER_CIDR" >/dev/null \
                || true
            fi

            rm -f "$KEY_FILE"
          }

          trap cleanup EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if aws ec2 authorize-security-group-ingress \
            --region "${{ inputs.region }}" \
            --group-id "$CONTROL_PLANE_SG" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" >/dev/null 2>&1; then
            ADDED_SSH_RULE="true"
          fi

          for attempt in $(seq 1 60); do
            if ssh \
              -i "$KEY_FILE" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "ubuntu@${CONTROL_PLANE_IP}" \
              "sudo cloud-init status --wait >/dev/null"; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for control-plane SSH and cloud-init."
              exit 1
            fi

            sleep 10
          done

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "ubuntu@${CONTROL_PLANE_IP}" \
            "mkdir -p /tmp/polyai-bootstrap"

          scp \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            infra/scripts/bootstrap-cluster.sh \
            infra/scripts/test-alert-chain.sh \
            "ubuntu@${CONTROL_PLANE_IP}:/tmp/polyai-bootstrap/"

          scp \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -r infra/argocd \
            "ubuntu@${CONTROL_PLANE_IP}:/tmp/polyai-bootstrap/argocd"

          scp \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -r infra/k8s \
            "ubuntu@${CONTROL_PLANE_IP}:/tmp/polyai-bootstrap/k8s"

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "ubuntu@${CONTROL_PLANE_IP}" \
            "sudo bash /tmp/polyai-bootstrap/bootstrap-cluster.sh /tmp/polyai-bootstrap/argocd /tmp/polyai-bootstrap/k8s/ingress /tmp/polyai-bootstrap/k8s/storage /tmp/polyai-bootstrap/k8s/monitoring '$SNS_TOPIC_ARN' '${{ inputs.region }}' '${{ inputs.admin_ssh_cidr }}' '$INGRESS_HTTP_NODE_PORT' '$INGRESS_HTTPS_NODE_PORT'"
