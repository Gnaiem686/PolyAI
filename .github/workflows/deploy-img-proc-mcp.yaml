name: Deploy Image Processing MCP

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "services/img-proc-mcp/**"
      - "docker-compose.deploy.yaml"
      - "monitoring/prometheus.yml"
      - ".github/workflows/deploy-img-proc-mcp.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: gnaiem686
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: ./services/img-proc-mcp
          push: true
          tags: gnaiem686/polyai-img-proc-mcp:${{ steps.vars.outputs.image_tag }}

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy MCP to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            mkdir -p /home/ubuntu/polyai-deploy/monitoring

            cp docker-compose.deploy.yaml /home/ubuntu/polyai-deploy/compose.yaml
            cp fluent-bit.conf /home/ubuntu/polyai-deploy/fluent-bit.conf
            cp monitoring/prometheus.yml /home/ubuntu/polyai-deploy/monitoring/prometheus.yml

            cd /home/ubuntu/polyai-deploy

            touch .env

            if grep -q "^IMG_PROC_MCP_IMAGE_TAG=" .env; then
              sed -i "s|^IMG_PROC_MCP_IMAGE_TAG=.*|IMG_PROC_MCP_IMAGE_TAG=${{ needs.build.outputs.image_tag }}|" .env
            else
              echo "IMG_PROC_MCP_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env
            fi

            docker login -u gnaiem686 -p "${{ secrets.DOCKERHUB_TOKEN }}"

            docker compose pull img-proc-mcp
            docker compose up -d img-proc-mcp

            docker image prune -f
            docker compose ps

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy MCP to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout main
            git reset --hard origin/main

            mkdir -p /home/ubuntu/polyai-deploy/monitoring

            cp docker-compose.deploy.yaml /home/ubuntu/polyai-deploy/compose.yaml
            cp fluent-bit.conf /home/ubuntu/polyai-deploy/fluent-bit.conf
            cp monitoring/prometheus.yml /home/ubuntu/polyai-deploy/monitoring/prometheus.yml

            cd /home/ubuntu/polyai-deploy

            touch .env

            if grep -q "^IMG_PROC_MCP_IMAGE_TAG=" .env; then
              sed -i "s|^IMG_PROC_MCP_IMAGE_TAG=.*|IMG_PROC_MCP_IMAGE_TAG=${{ needs.build.outputs.image_tag }}|" .env
            else
              echo "IMG_PROC_MCP_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env
            fi

            docker login -u gnaiem686 -p "${{ secrets.DOCKERHUB_TOKEN }}"

            docker compose pull img-proc-mcp
            docker compose up -d img-proc-mcp

            docker image prune -f
            docker compose ps
