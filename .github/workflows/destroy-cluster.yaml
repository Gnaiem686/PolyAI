name: Destroy Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region to destroy
        required: true
        default: us-east-1
        type: string
      confirmation:
        description: Type DESTROY to confirm removal of the cluster
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: polyai-cluster-${{ inputs.region }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: Clean Kubernetes and destroy AWS infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "Confirmation must be exactly DESTROY."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Initialize Terraform state
        id: terraform
        working-directory: infra/tf
        run: |
          set -euo pipefail

          TFVARS_FILE="tfvars/${{ inputs.region }}.tfvars"

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "Missing Terraform variables file: $TFVARS_FILE"
            exit 1
          fi

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="polyai-tfstate-${ACCOUNT_ID}-${{ inputs.region }}"

          terraform init \
            -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=polyai-cluster.tfstate" \
            -backend-config="region=${{ inputs.region }}" \
            -backend-config="encrypt=true"

          terraform workspace select "${{ inputs.region }}"

          echo "control_plane_instance_id=$(terraform output -raw control_plane_instance_id)" >> "$GITHUB_OUTPUT"
          echo "control_plane_security_group_id=$(terraform output -raw control_plane_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "worker_asg_name=$(terraform output -raw worker_autoscaling_group_name)" >> "$GITHUB_OUTPUT"

      - name: Recover cluster access for cleanup
        id: cluster_access
        env:
          CONTROL_PLANE_INSTANCE_ID: ${{ steps.terraform.outputs.control_plane_instance_id }}
          WORKER_ASG_NAME: ${{ steps.terraform.outputs.worker_asg_name }}
        run: |
          set -euo pipefail

          INSTANCE_STATE=$(
            aws ec2 describe-instances \
              --region "${{ inputs.region }}" \
              --instance-ids "$CONTROL_PLANE_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text
          )

          if [ "$INSTANCE_STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped \
              --region "${{ inputs.region }}" \
              --instance-ids "$CONTROL_PLANE_INSTANCE_ID"
            INSTANCE_STATE="stopped"
          fi

          if [ "$INSTANCE_STATE" = "stopped" ]; then
            echo "Starting the stopped control-plane instance for Kubernetes cleanup..."
            aws ec2 start-instances \
              --region "${{ inputs.region }}" \
              --instance-ids "$CONTROL_PLANE_INSTANCE_ID" >/dev/null
          elif [ "$INSTANCE_STATE" != "running" ] && [ "$INSTANCE_STATE" != "pending" ]; then
            echo "Cannot clean a control-plane instance in state: $INSTANCE_STATE"
            exit 1
          fi

          aws ec2 wait instance-running \
            --region "${{ inputs.region }}" \
            --instance-ids "$CONTROL_PLANE_INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --region "${{ inputs.region }}" \
            --instance-ids "$CONTROL_PLANE_INSTANCE_ID"

          CONTROL_PLANE_IP=$(
            aws ec2 describe-instances \
              --region "${{ inputs.region }}" \
              --instance-ids "$CONTROL_PLANE_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text
          )

          if [ -z "$CONTROL_PLANE_IP" ] || [ "$CONTROL_PLANE_IP" = "None" ]; then
            echo "The running control plane has no public IP address."
            exit 1
          fi

          WORKER_DESIRED=$(
            aws autoscaling describe-auto-scaling-groups \
              --region "${{ inputs.region }}" \
              --auto-scaling-group-names "$WORKER_ASG_NAME" \
              --query 'AutoScalingGroups[0].DesiredCapacity' \
              --output text
          )

          if [ "$WORKER_DESIRED" = "0" ]; then
            echo "Starting one temporary worker for ArgoCD and EBS cleanup..."
            aws autoscaling update-auto-scaling-group \
              --region "${{ inputs.region }}" \
              --auto-scaling-group-name "$WORKER_ASG_NAME" \
              --desired-capacity 1
          fi

          echo "control_plane_ip=$CONTROL_PLANE_IP" >> "$GITHUB_OUTPUT"

      - name: Clean Kubernetes resources over SSH
        env:
          CONTROL_PLANE_IP: ${{ steps.cluster_access.outputs.control_plane_ip }}
          CONTROL_PLANE_SG: ${{ steps.terraform.outputs.control_plane_security_group_id }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          RUNNER_CIDR="$(curl -fsSL https://checkip.amazonaws.com)/32"
          KEY_FILE="${RUNNER_TEMP}/polyai-cluster.pem"
          ADDED_SSH_RULE="false"

          cleanup() {
            if [ "$ADDED_SSH_RULE" = "true" ]; then
              aws ec2 revoke-security-group-ingress \
                --region "${{ inputs.region }}" \
                --group-id "$CONTROL_PLANE_SG" \
                --protocol tcp \
                --port 22 \
                --cidr "$RUNNER_CIDR" >/dev/null \
                || true
            fi

            rm -f "$KEY_FILE"
          }

          trap cleanup EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if aws ec2 authorize-security-group-ingress \
            --region "${{ inputs.region }}" \
            --group-id "$CONTROL_PLANE_SG" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" >/dev/null 2>&1; then
            ADDED_SSH_RULE="true"
          fi

          for attempt in $(seq 1 60); do
            if ssh \
              -i "$KEY_FILE" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "ubuntu@${CONTROL_PLANE_IP}" \
              "true"; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for control-plane SSH."
              exit 1
            fi

            sleep 10
          done

          scp \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            infra/scripts/cleanup-cluster.sh \
            "ubuntu@${CONTROL_PLANE_IP}:/tmp/cleanup-cluster.sh"

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "ubuntu@${CONTROL_PLANE_IP}" \
            "sudo bash /tmp/cleanup-cluster.sh"

      - name: Destroy Terraform infrastructure
        working-directory: infra/tf
        run: |
          terraform destroy \
            -auto-approve \
            -var-file="tfvars/${{ inputs.region }}.tfvars"
