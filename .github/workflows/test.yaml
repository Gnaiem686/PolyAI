name: Run Tests

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r services/yolo/torch-requirements.txt
          pip install -r services/yolo/requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ --cov=app --cov-report=xml
        working-directory: services/yolo

      - name: Test cluster cleanup safety
        run: bash infra/scripts/tests/test-cleanup-cluster.sh

      - name: Test ingress client IP configuration
        run: bash infra/scripts/tests/test-ingress-values.sh

      - name: Test worker S3 object permissions
        run: bash infra/scripts/tests/test-worker-s3-policy.sh

      - name: Test worker Bedrock model permission
        run: bash infra/scripts/tests/test-worker-bedrock-policy.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: services/yolo/coverage.xml
          fail_ci_if_error: false

  docker-scout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        service:
          - context: services/yolo
            image: yolo-service
            build_args: ""
          - context: services/agent
            image: agent-service
            build_args: ""
          - context: services/frontend
            image: frontend-service
            build_args: NEXT_PUBLIC_AGENT_URL=http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:scout-test
          build-args: ${{ matrix.service.build_args }}

      - uses: docker/scout-action@v1.18.2
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:scout-test
          only-severities: critical,high
          exit-code: false
