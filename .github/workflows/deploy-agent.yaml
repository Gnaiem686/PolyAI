name: Deploy Agent

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "services/agent/**"
      - "docker-compose.deploy.yaml"
      - ".github/workflows/deploy-agent.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: gnaiem686
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Agent image
        uses: docker/build-push-action@v6
        with:
          context: ./services/agent
          push: true
          tags: gnaiem686/polyai-agent:${{ steps.vars.outputs.image_tag }}

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Agent to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            touch .env.deploy

            if grep -q "^AGENT_IMAGE_TAG=" .env.deploy; then
              sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${{ needs.build.outputs.image_tag }}|" .env.deploy
            else
              echo "AGENT_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env.deploy
            fi

            docker login -u gnaiem686 -p "${{ secrets.DOCKERHUB_TOKEN }}"

            docker compose --env-file .env.deploy -f docker-compose.deploy.yaml pull agent
            docker compose --env-file .env.deploy -f docker-compose.deploy.yaml up -d agent

            docker image prune -f
            docker compose --env-file .env.deploy -f docker-compose.deploy.yaml ps

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Agent to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/PolyAI

            git fetch origin
            git checkout main
            git reset --hard origin/main

            touch .env.deploy

            if grep -q "^AGENT_IMAGE_TAG=" .env.deploy; then
              sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${{ needs.build.outputs.image_tag }}|" .env.deploy
            else
              echo "AGENT_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env.deploy
            fi

            docker login -u gnaiem686 -p "${{ secrets.DOCKERHUB_TOKEN }}"

            docker compose --env-file .env.deploy -f docker-compose.deploy.yaml pull agent
            docker compose --env-file .env.deploy -f docker-compose.deploy.yaml up -d agent

            docker image prune -f
            docker compose --env-file .env.deploy -f docker-compose.deploy.yaml ps